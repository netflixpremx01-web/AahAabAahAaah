name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o ton-terminal-flat.zip -d extracted

      - name: Copy extracted files
        run: |
          cp -r extracted/* .
          rm -rf extracted
          rm -f ton-terminal-flat.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract project ZIP" || echo "Nothing to commit"
          git push
